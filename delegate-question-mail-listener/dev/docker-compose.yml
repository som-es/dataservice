# GreenMail dev/test mail sandbox for the delegate question reply listener.
# Docs: https://greenmail-mail-test.github.io/greenmail/#deploy_docker_standalone
#
# Ports are the standard mail ports + 3000 inside the container:
#   SMTP 3025 / IMAP 3143 / IMAPS 3993 / API 8080
# Mail is held in memory only: restarting the container empties every mailbox.
name: delegate-question-mail-dev

services:
  mail:
    image: greenmail/standalone:2.1.13
    container_name: dqmail-dev-mail
    restart: unless-stopped
    environment:
      # questions@somes.local with password "questions"; login uses the full address,
      # which is what MAIL_INBOUND_USERNAME sends. TLS uses the image's self-signed
      # keystore, so keep MAIL_INBOUND_TLS_SKIP_VERIFY=true.
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=questions:questions@somes.local
        -Dgreenmail.users.login=email
    ports:
      - "127.0.0.1:2525:3025" # SMTP, matches dev/send-reply.py defaults
      - "127.0.0.1:10993:3993" # IMAPS, matches .env.dev MAIL_INBOUND_HOST/PORT
