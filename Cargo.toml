[package]
name = "dataservice"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = {version="0.4.24", optional=true, features = ["serde"]}
# diesel = {version = "2.0.3", features = ["postgres", "chrono"] }
dotenvy = { version = "0.15.7", optional=true}
log = {version = "0.4.17", optional=true}
reqwest = { version = "0.12", features = ["json", "blocking"], optional=true }

somes-scraper = {path = "../scraper"}
somes-common-lib = {path = "../somes/somes-common-lib"}
serde = "1.0"
serde_derive = "1.0"
simple_logger = { version="5", optional = true}
sqlx = { version="0.8", features = ["postgres", "runtime-tokio", "chrono"] }
tokio = { version = "1", features = ["tokio-macros", "macros", "rt", "rt-multi-thread", "signal"], optional=true }
dotenv_codegen = "0.15.0"
utoipa = { version = "4.2.0", optional = true }
pollster = "0.3.0"
lettre = "0.11.12"
image = "0.25.5"
imageproc = "0.25.0"
serde_json = "1.0.138"
[dev-dependencies]
rand = "0.8"

[features]
# default = ["runner", "parties"]
default = ["runner", "legis_init_latest", "legis_init", "ministerial_latest", "ministerial", "proposals_latest", "proposals", "plenar", "parties"]
# default = ["runner", "plenar"]
models = ["dotenvy", "chrono"]
runner = ["models", "chrono", "reqwest", "simple_logger", "tokio", "log", "dotenvy"]
utoipa = ["dep:utoipa"]

legis_init_latest = []
legis_init = []
ministerial_latest = []
ministerial = []
proposals_latest = []
proposals = []
plenar = []
parties = []
