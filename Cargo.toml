[workspace]
members = [
    "combx",
    "dataservice",
    "getdata", "somai-client", "unique-topics", "update-notify", "upload-political-questions",
    "delegate-question-mail",
    "delegate-question-mail-listener",
]

[workspace.dependencies]
sqlx = { version="0.8", features = ["postgres", "runtime-tokio", "chrono", "tls-rustls", "uuid"] }
somes-scraper = { path = "../scraper" }
# somes-scraper = { git = "ssh://git@github.com/som-es/scraper" }
somes-common-lib = {path = "../somes/somes-common-lib"}
# somes-common-lib = { branch="sveltev5", git = "ssh://git@github.com/som-es/somes" }
chrono = "0.4.41"
serde = { version = "1.0.219", features = ["derive"] }
serde_derive = "1.0.219"
dotenvy_macro = "0.15.7"
log = "0.4.27"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full", "tokio-macros", "macros", "rt", "rt-multi-thread", "signal"] }
utoipa = { version = "5", features = ["chrono", "axum_extras"] }
schemars = "1.1.0"
ocrs = "0.11.0"
tesseract-rs = { version = "0.1.20", features = ["build-tesseract"] }
chrono-tz = {version="0.10.4", features=["serde"]}
eurovoc = { path = "../eurovoc", default-features = false, features = ["serde"] }
