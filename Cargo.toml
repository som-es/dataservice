[package]
name = "dataservice"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.24"
diesel = {version = "2.0.3", features = ["postgres"] }
dotenvy = "0.15.7"
log = "0.4.17"
reqwest = { version = "0.11.16", features = ["blocking"] }

scraper = {path = "../scraper"}
simple_logger = "4.1.0"
tokio = { version = "1.26.0", features = ["tokio-macros", "macros", "rt", "rt-multi-thread", "signal"] }
