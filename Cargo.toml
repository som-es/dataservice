[package]
name = "dataservice"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = {version="0.4.24", optional=true, features = ["serde"]}
diesel = {version = "2.0.3", features = ["postgres", "chrono"] }
dotenvy = { version = "0.15.7", optional=true}
log = {version = "0.4.17", optional=true}
reqwest = { version = "0.12", features = ["blocking"], optional=true }

scraper = {path = "../scraper"}
serde = "1.0.160"
serde_derive = "1.0.160"
simple_logger = { version="4.1.0", optional = true}
tokio = { version = "1.26.0", features = ["tokio-macros", "macros", "rt", "rt-multi-thread", "signal"], optional=true }

utoipa = { version = "4.2.0", optional = true }

[features]
default = ["runner"]
models = ["dotenvy", "chrono"]
runner = ["models", "chrono", "reqwest", "simple_logger", "tokio", "log", "dotenvy"]
utoipa = ["dep:utoipa"]
