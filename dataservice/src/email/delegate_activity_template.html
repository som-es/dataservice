<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Neue Abgeordnetenaktivität</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                font-family: Arial, sans-serif;
                background-color: #f4f4f4;
                -webkit-text-size-adjust: 100%;
                -ms-text-size-adjust: 100%;
            }
            table {
                border-collapse: collapse;
                mso-table-lspace: 0pt;
                mso-table-rspace: 0pt;
            }
            img {
                border: 0;
                line-height: 100%;
                outline: none;
                text-decoration: none;
                -ms-interpolation-mode: bicubic;
            }
            .email-container {
                max-width: 600px;
                width: 100%;
                margin: 30px auto;
                background-color: #ffffff;
                border-radius: 8px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
                overflow: hidden;
            }
            .header {
                background-color: #d8806f;
                color: white;
                text-align: center;
                padding: 20px 10px;
            }
            .header h1 {
                margin: 0;
                font-size: 1.5rem;
                line-height: 1.3;
                word-wrap: break-word;
            }
            .content {
                padding: 20px;
                text-align: center;
            }
            .footer {
                text-align: center;
                font-size: 0.9rem;
                color: #888888;
                padding: 10px;
                background-color: #f8dfca;
            }
            .footer p {
                margin: 0;
            }
        </style>
    </head>
    <body>
        <div class="email-container">
            <div class="header">
                <h1>Neue Abgeordnetenaktivität</h1>
            </div>
            <div class="content">
                <p style="margin: 0 0 8px 0">
                    Zusammenfassung der Aktivitäten Ihrer favorisierten
                    Abgeordneten
                </p>

                <div>{*DELEGATES*}</div>

                <hr style="border: none; border-top: 1px solid #eee; margin: 24px 0" />
                <table
                    role="presentation"
                    cellspacing="0"
                    cellpadding="0"
                    border="0"
                    align="center"
                    style="margin: 0 auto"
                >
                    <tr>
                        <td style="vertical-align: middle; padding-right: 10px">
                            <img
                                src="https://somes.at/images/somes_logo.png"
                                alt="somes"
                                width="48"
                                style="
                                    display: block;
                                    width: 48px;
                                    height: auto;
                                "
                            />
                        </td>
                        <td
                            style="
                                vertical-align: middle;
                                font-weight: 200;
                                font-size: 32px;
                                line-height: 1;
                            "
                        >
                            somes
                        </td>
                    </tr>
                </table>
            </div>
            <div class="footer">
                <p>&copy; 2026 somes</p>
            </div>
        </div>
    </body>
</html>
