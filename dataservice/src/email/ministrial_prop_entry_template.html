<a href="{*PROPOSAL_SOMES_URL*}">
    <table
        role="presentation"
        width="100%"
        cellspacing="0"
        cellpadding="0"
        border="0"
        style="margin-top: 20px; font-family: Arial, sans-serif; color: black"
    >
        <tr>
            <td
                style="
                    border-radius: 0.9rem;
                    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                    background-color: rgb(195, 205, 217);
                    padding: 20px;
                "
            >
                <table
                    role="presentation"
                    width="100%"
                    cellspacing="0"
                    cellpadding="0"
                    border="0"
                >
                    <tr valign="top">
                        <!-- LEFT CONTENT -->
                        <td style="vertical-align: top; width: 100%">
                            <!-- PROPOSAL DESCRIPTION -->
                            <div style="font-size: 14px; margin-bottom: 8px">
                                {*PROPOSAL_DESCRIPTION*}
                            </div>

                            <!-- TAG BADGES -->
                            <table
                                role="presentation"
                                cellspacing="0"
                                cellpadding="0"
                                border="0"
                                style="border-collapse: collapse"
                            >
                                <tr>
                                    <td
                                        style="
                                            background-color: rgb(
                                                250,
                                                233,
                                                218
                                            );
                                            color: black;
                                            font-size: 12px;
                                            line-height: 16px;
                                            font-weight: 600;
                                            border-radius: 6px;
                                            padding: 4px 8px;
                                            white-space: nowrap;
                                        "
                                    >
                                        {*PROPOSAL_MINISTRY*}
                                    </td>
                                    <td width="6"></td>
                                    <td
                                        style="
                                            background-color: rgb(
                                                250,
                                                233,
                                                218
                                            );
                                            color: black;
                                            font-size: 12px;
                                            line-height: 16px;
                                            font-weight: 600;
                                            border-radius: 6px;
                                            padding: 4px 8px;
                                            white-space: nowrap;
                                        "
                                    >
                                        {*PROPOSAL_DATE*}
                                    </td>
                                    <td width="6"></td>
                                    <td
                                        style="
                                            background-color: rgb(
                                                250,
                                                233,
                                                218
                                            );
                                            color: black;
                                            font-size: 12px;
                                            line-height: 16px;
                                            font-weight: 600;
                                            border-radius: 6px;
                                            padding: 4px 8px;
                                            white-space: nowrap;
                                        "
                                    >
                                        {*PROPOSAL_GP*}
                                    </td>
                                    <td width="6"></td>
                                    <td
                                        style="
                                            background-color: rgb(
                                                250,
                                                233,
                                                218
                                            );
                                            color: black;
                                            font-size: 12px;
                                            line-height: 16px;
                                            font-weight: 600;
                                            border-radius: 6px;
                                            padding: 4px 8px;
                                            white-space: nowrap;
                                        "
                                    >
                                        {*PROPOSAL_GOV_OFFICIAL_NAME*}
                                    </td>
                                </tr>
                            </table>
                        </td>

                        <!-- RIGHT CONTENT: DELEGATE IMAGE -->
                        <td
                            style="
                                vertical-align: middle;
                                padding-left: 10px;
                                text-align: right;
                            "
                        >
                            <img
                                src="{*PROPOSAL_DELEGATE_IMG_URL*}"
                                alt="Image of delegate {*PROPOSAL_GOV_OFFICIAL_NAME*}"
                                style="
                                    min-width: 80px;
                                    max-height: 80px;
                                    border-radius: 50%;
                                    margin-left: 8px;
                                    object-fit: cover;
                                    display: block;
                                "
                            />
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</a>
