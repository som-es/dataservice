<a href="{*DECREE_SOMES_URL*}" style="text-decoration: none; color: inherit; display: block; margin-top: 12px;">
    <table
        role="presentation"
        width="100%"
        cellspacing="0"
        cellpadding="0"
        border="0"
        style="font-family: Arial, sans-serif; border-collapse: separate; width: 100%;"
    >
        <tr>
            <td
                bgcolor="#c3cdd9"
                class="dm-item-card"
                style="
                    background-color: #c3cdd9;
                    border-radius: 10px;
                    padding: 16px 18px;
                    color: #1a1a1a;
                "
            >
                <!-- Delegate byline: avatar + name -->
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin-bottom: 12px;">
                    <tr>
                        <td style="vertical-align: middle; padding-right: 8px; width: 32px;">
                            <img
                                src="{*DECREE_DELEGATE_IMG_URL*}"
                                alt="{*DECREE_GOV_OFFICIAL_NAME*}"
                                width="32"
                                height="32"
                                style="display: block; width: 32px; height: 32px; border-radius: 50%; object-fit: cover;"
                            />
                        </td>
                        <td style="vertical-align: middle;">
                            <span
                                class="dm-author"
                                style="
                                    font-family: Arial, sans-serif;
                                    font-size: 13px;
                                    font-weight: 600;
                                    color: #333333;
                                    line-height: 1.2;
                                "
                            >{*DECREE_GOV_OFFICIAL_NAME*}</span>
                        </td>
                    </tr>
                </table>

                <!-- Description -->
                <div
                    class="dm-card-text"
                    style="
                        font-family: Arial, sans-serif;
                        font-size: 14px;
                        line-height: 1.5;
                        color: #1a1a1a;
                        margin-bottom: 12px;
                        word-wrap: break-word;
                        overflow-wrap: break-word;
                        word-break: break-word;
                    "
                >
                    {*DECREE_DESCRIPTION*}
                </div>

                <!-- Tag badges -->
                <div style="font-size: 0; line-height: 0; margin-bottom: 10px;">
                    <span
                        class="dm-badge"
                        style="
                            display: inline-block;
                            background-color: #fae9da;
                            color: #000000;
                            font-family: Arial, sans-serif;
                            font-size: 12px;
                            line-height: 16px;
                            font-weight: 600;
                            border-radius: 6px;
                            padding: 4px 8px;
                            margin: 0 6px 6px 0;
                            white-space: nowrap;
                        "
                        >{*DECREE_MINISTRY*}</span
                    ><span
                        class="dm-badge"
                        style="
                            display: inline-block;
                            background-color: #fae9da;
                            color: #000000;
                            font-family: Arial, sans-serif;
                            font-size: 12px;
                            line-height: 16px;
                            font-weight: 600;
                            border-radius: 6px;
                            padding: 4px 8px;
                            margin: 0 6px 6px 0;
                            white-space: nowrap;
                        "
                        >{*DECREE_DATE*}</span
                    ><span
                        class="dm-badge"
                        style="
                            display: inline-block;
                            background-color: #fae9da;
                            color: #000000;
                            font-family: Arial, sans-serif;
                            font-size: 12px;
                            line-height: 16px;
                            font-weight: 600;
                            border-radius: 6px;
                            padding: 4px 8px;
                            margin: 0 6px 6px 0;
                            white-space: nowrap;
                        "
                        >{*DECREE_GP*}</span
                    >
                </div>

                <!-- Link -->
                <div style="margin-top: 2px;">
                    <span class="dm-link" style="font-family: Arial, sans-serif; font-size: 13px; color: #d8806f; font-weight: 600;">Auf somes ansehen &#8594;</span>
                </div>
            </td>
        </tr>
    </table>
</a>
