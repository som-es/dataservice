<div style="margin: 20px 0; text-align: left;">
    <!-- Delegate header: avatar + name + party -->
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-bottom: 16px;">
        <tr>
            <td style="vertical-align: middle; width: 72px; padding-right: 14px;">
                <img
                    src="{*DELEGATE_IMG_URL*}"
                    alt="{*DELEGATE_NAME*}"
                    width="72"
                    height="72"
                    style="display: block; width: 72px; height: 72px; border-radius: 50%; object-fit: cover;"
                />
            </td>
            <td style="vertical-align: middle;">
                <h2 class="dm-card-text" style="margin: 0 0 4px 0; font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; color: #1a1a1a; line-height: 1.3; word-wrap: break-word;">
                    {*DELEGATE_NAME*}
                </h2>
                <p class="dm-muted" style="margin: 0; font-family: Arial, sans-serif; font-size: 14px; color: #777777; word-wrap: break-word;">
                    {*DELEGATE_PARTY*}
                </p>
            </td>
        </tr>
    </table>

    {*DECREES*}
    {*GOV_PROPOSALS*}
    {*ISSUED_PROPOSALS*}
    {*NAMED_VOTES*}
    {*SPEECHES*}
    {*CALL_TO_ORDERS*}
</div>
