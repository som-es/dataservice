<div
    style="
        display: flex;
        flex-direction: column;
        margin: 24px 0;
        text-align: left;
    "
>
    <div style="display: flex; align-items: center; margin-bottom: 12px">
        <img
            src="{*DELEGATE_IMG_URL*}"
            alt="Image of delegate {*DELEGATE_NAME*}"
            style="
                min-width: 80px;
                width: 80px;
                height: 80px;
                border-radius: 50%;
                margin-right: 12px;
                object-fit: cover;
                display: block;
            "
        />
        <div>
            <h2 style="margin: 0; font-size: 1.25rem">{*DELEGATE_NAME*}</h2>
            <p style="margin: 4px 0 0 0; color: #777">{*DELEGATE_PARTY*}</p>
        </div>
    </div>

    <div style="display: flex; flex-direction: column">{*DECREES*}</div>
    <div style="display: flex; flex-direction: column">{*GOV_PROPOSALS*}</div>
    <div style="display: flex; flex-direction: column">
        {*ISSUED_PROPOSALS*}
    </div>
    <div style="display: flex; flex-direction: column">{*NAMED_VOTES*}</div>
    <div style="display: flex; flex-direction: column">{*SPEECHES*}</div>
    <div style="display: flex; flex-direction: column">{*CALL_TO_ORDERS*}</div>
</div>
