<a href="{*VOTE_RESULT_SOMES_URL*}">
    <table
        role="presentation"
        width="100%"
        cellspacing="0"
        cellpadding="0"
        border="0"
        style="margin-top: 20px; font-family: Arial, sans-serif; color: black"
    >
        <tr>
            <td
                style="
                    border-radius: 0.9rem;
                    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                    background-color: rgb(195, 205, 217);
                    padding: 20px;
                "
            >
                <table
                    role="presentation"
                    width="100%"
                    cellspacing="0"
                    cellpadding="0"
                    border="0"
                >
                    <tr valign="top">
                        <!-- LEFT CONTENT -->
                        <td style="vertical-align: top; width: 100%">
                            <!-- VOTE RESULT DESCRIPTION -->
                            <div style="font-size: 14px; margin-bottom: 8px">
                                {*VOTE_RESULT_DESCRIPTION*}
                            </div>

                            <!-- TAG BADGES -->
                            <table
                                role="presentation"
                                cellspacing="0"
                                cellpadding="0"
                                border="0"
                                style="border-collapse: collapse"
                            >
                                <tr>
                                    <td
                                        style="
                                            background-color: rgb(
                                                250,
                                                233,
                                                218
                                            );
                                            color: black;
                                            font-size: 12px;
                                            line-height: 16px;
                                            font-weight: 600;
                                            border-radius: 6px;
                                            padding: 4px 8px;
                                            white-space: nowrap;
                                        "
                                    >
                                        {*VOTE_RESULT_GP*}
                                    </td>
                                    <td width="6"></td>
                                    <td
                                        style="
                                            background-color: rgb(
                                                250,
                                                233,
                                                218
                                            );
                                            color: black;
                                            font-size: 12px;
                                            line-height: 16px;
                                            font-weight: 600;
                                            border-radius: 6px;
                                            padding: 4px 8px;
                                            white-space: nowrap;
                                        "
                                    >
                                        {*VOTE_RESULT_TYPE*}
                                    </td>
                                    <td width="6"></td>
                                    <td
                                        style="
                                            background-color: rgb(
                                                250,
                                                233,
                                                218
                                            );
                                            color: black;
                                            font-size: 12px;
                                            line-height: 16px;
                                            font-weight: 600;
                                            border-radius: 6px;
                                            padding: 4px 8px;
                                            white-space: nowrap;
                                        "
                                    >
                                        {*VOTE_RESULT_OUTCOME*}
                                    </td>
                                </tr>
                            </table>
                            <!-- VOTE PARTY RESULTS -->
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</a>
