<a href="{*VOTE_RESULT_SOMES_URL*}" style="text-decoration: none; color: inherit; display: block; margin-top: 12px;">
    <table
        role="presentation"
        width="100%"
        cellspacing="0"
        cellpadding="0"
        border="0"
        style="font-family: Arial, sans-serif; border-collapse: separate; width: 100%;"
    >
        <tr>
            <td
                bgcolor="#c3cdd9"
                class="dm-item-card"
                style="
                    background-color: #c3cdd9;
                    border-radius: 10px;
                    padding: 16px 18px;
                    color: #1a1a1a;
                "
            >
                <!-- Description -->
                <div
                    class="dm-card-text"
                    style="
                        font-family: Arial, sans-serif;
                        font-size: 14px;
                        line-height: 1.5;
                        color: #1a1a1a;
                        margin-bottom: 12px;
                        word-wrap: break-word;
                        overflow-wrap: break-word;
                        word-break: break-word;
                    "
                >
                    {*VOTE_RESULT_DESCRIPTION*}
                </div>

                <!-- Tag badges -->
                <div style="font-size: 0; line-height: 0; margin-bottom: 10px;">
                    <span
                        class="dm-badge"
                        style="
                            display: inline-block;
                            background-color: #fae9da;
                            color: #000000;
                            font-family: Arial, sans-serif;
                            font-size: 12px;
                            line-height: 16px;
                            font-weight: 600;
                            border-radius: 6px;
                            padding: 4px 8px;
                            margin: 0 6px 6px 0;
                            white-space: nowrap;
                        "
                        >{*VOTE_RESULT_GP*}</span
                    ><span
                        class="dm-badge"
                        style="
                            display: inline-block;
                            background-color: #fae9da;
                            color: #000000;
                            font-family: Arial, sans-serif;
                            font-size: 12px;
                            line-height: 16px;
                            font-weight: 600;
                            border-radius: 6px;
                            padding: 4px 8px;
                            margin: 0 6px 6px 0;
                            white-space: nowrap;
                        "
                        >{*VOTE_RESULT_TYPE*}</span
                    ><span
                        class="dm-badge"
                        style="
                            display: inline-block;
                            background-color: #fae9da;
                            color: #000000;
                            font-family: Arial, sans-serif;
                            font-size: 12px;
                            line-height: 16px;
                            font-weight: 600;
                            border-radius: 6px;
                            padding: 4px 8px;
                            margin: 0 6px 6px 0;
                            white-space: nowrap;
                        "
                        >{*VOTE_RESULT_OUTCOME*}</span
                    >{*VOTE_RESULT_DATE_BADGE*}
                </div>

                <!-- Party vote results -->
                <div
                    class="dm-muted"
                    style="
                        font-family: Arial, sans-serif;
                        font-size: 13px;
                        line-height: 1.5;
                        color: #444444;
                        word-wrap: break-word;
                        overflow-wrap: break-word;
                    "
                >
                    {*VOTE_RESULT_PARTY_VOTES*}
                </div>

                <!-- Link -->
                <div style="margin-top: 12px;">
                    <span class="dm-link" style="font-family: Arial, sans-serif; font-size: 13px; color: #d8806f; font-weight: 600;">Auf somes ansehen &#8594;</span>
                </div>
            </td>
        </tr>
    </table>
</a>
