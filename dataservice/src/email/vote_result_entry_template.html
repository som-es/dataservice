<a href="{*VOTE_RESULT_SOMES_URL*}" style="text-decoration: none; color: inherit; display: block">
    <table
        role="presentation"
        width="100%"
        cellspacing="0"
        cellpadding="0"
        border="0"
        style="
            margin-top: 20px;
            font-family: Arial, sans-serif;
            color: black;
            table-layout: fixed;
            width: 100%;
            border-collapse: separate;
        "
    >
        <tr>
            <td
                style="
                    border-radius: 0.9rem;
                    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                    background-color: rgb(195, 205, 217);
                    padding: 20px;
                "
            >
                <!-- VOTE RESULT DESCRIPTION -->
                <div
                    style="
                        font-size: 14px;
                        line-height: 1.4;
                        margin-bottom: 8px;
                        word-wrap: break-word;
                        overflow-wrap: break-word;
                        word-break: break-word;
                    "
                >
                    {*VOTE_RESULT_DESCRIPTION*}
                </div>

                <!-- TAG BADGES (inline-block so they wrap) -->
                <div style="font-size: 0; line-height: 0">
                    <span
                        style="
                            display: inline-block;
                            background-color: rgb(250, 233, 218);
                            color: black;
                            font-size: 12px;
                            line-height: 16px;
                            font-weight: 600;
                            border-radius: 6px;
                            padding: 4px 8px;
                            margin: 0 6px 6px 0;
                            white-space: nowrap;
                        "
                        >{*VOTE_RESULT_GP*}</span
                    ><span
                        style="
                            display: inline-block;
                            background-color: rgb(250, 233, 218);
                            color: black;
                            font-size: 12px;
                            line-height: 16px;
                            font-weight: 600;
                            border-radius: 6px;
                            padding: 4px 8px;
                            margin: 0 6px 6px 0;
                            white-space: nowrap;
                        "
                        >{*VOTE_RESULT_TYPE*}</span
                    ><span
                        style="
                            display: inline-block;
                            background-color: rgb(250, 233, 218);
                            color: black;
                            font-size: 12px;
                            line-height: 16px;
                            font-weight: 600;
                            border-radius: 6px;
                            padding: 4px 8px;
                            margin: 0 6px 6px 0;
                            white-space: nowrap;
                        "
                        >{*VOTE_RESULT_OUTCOME*}</span
                    >
                </div>

                <!-- VOTE PARTY RESULTS -->
                <div
                    style="
                        margin-top: 10px;
                        font-size: 13px;
                        line-height: 1.4;
                        color: #333;
                        word-wrap: break-word;
                        overflow-wrap: break-word;
                    "
                >
                    {*VOTE_RESULT_PARTY_VOTES*}
                </div>
            </td>
        </tr>
    </table>
</a>
