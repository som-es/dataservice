[package]
name = "dataservice"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sqlx = { workspace = true }
somes-scraper = { workspace = true }
chrono = { workspace = true, optional = true }
serde = { workspace = true }
serde_derive = { workspace = true }
dotenvy_macro = { workspace = true }
log = { workspace = true }
# diesel = {version = "2.0.3", features = ["postgres", "chrono"] }
dotenvy = { version = "0.15.7", optional=true}
reqwest = { version = "0.12", features = ["json", "blocking"], optional=true }

somes-common-lib = {path = "../../somes/somes-common-lib"}
combx = { path = "../combx" }
simple_logger = { version="5", optional = true}
tokio = { version = "1", features = ["tokio-macros", "macros", "rt", "rt-multi-thread", "signal"], optional=true }
utoipa = { version = "4.2.0", optional = true }
pollster = "0.4.0"
lettre = "0.11.12"
image = "0.25.5"
imageproc = "0.25.0"
serde_json = "1.0.138"
once_cell = "1.20.3"
base64 = "0.21.0"
[dev-dependencies]
rand = "0.9"

[features]
#default = ["runner", "legis_init"]
# default = ["runner", "legis_init_latest", "legis_init", "ministerial_latest", "ministerial", "proposals_latest", "proposals", "plenar", "parties"]
# default = ["runner", "ministerial_latest", "ministerial", "legis_init", "legis_init_latest", "plenar", "decrees"]
default = ["runner", "plenar"]
# default = ["runner", "ministerial_latest", "legis_init", "plenar", ]
models = ["dotenvy", "chrono"]
runner = ["models", "chrono", "reqwest", "simple_logger", "tokio", "dotenvy"]
utoipa = ["dep:utoipa", "combx/utoipa"]

legis_init_latest = []
legis_init = []
ministerial_latest = []
ministerial = []
proposals_latest = []
proposals = []
plenar = []
plenar_latest = []
parties = []
decrees = []
