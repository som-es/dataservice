[package]
name = "dataservice"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sqlx = { workspace = true }
somes-scraper = { workspace = true }
chrono = { workspace = true, optional = true }
serde = { workspace = true }
serde_derive = { workspace = true }
dotenvy_macro = { workspace = true }
log = { workspace = true }
# diesel = {version = "2.0.3", features = ["postgres", "chrono"] }
dotenvy = { version = "0.15.7", optional=true}
reqwest = {workspace=true, optional=true}

somes-common-lib = {workspace = true }
combx = { path = "../combx" }
update-notify = { path = "../update-notify" }
simple_logger = { version="5", optional = true}
utoipa = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
somai-client = { path = "../somai-client" }
eurovoc = { workspace = true }
pollster = "0.4.0"
lettre = "0.11.12"
image = "0.25.5"
imageproc = "0.25.0"
serde_json = "1.0.138"
once_cell = "1.20.3"
base64 = "0.21.0"
serde_plain = "1.0.2"
ocrs = { workspace = true, optional = true }
clap = { version = "4.5.53", features = ["derive"] }
schemars = { workspace = true }
tesseract-rs = { workspace = true, optional = true }
chrono-tz = {workspace = true}
redis = { version = "1.0", features = ["tokio-comp", "connection-manager"] }
regex = "1.12.3"
qdrant-client = {version = "1.19.0", optional = true}
uuid = {version = "1.23.0", optional = true, features =  ["v4"] }
async-trait = "0.1.89"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sitemaps = { path = "../../sitemaps" }

[dev-dependencies]
rand = "0.9"

[features]
# default = ["runner", "vectordb", "ministerial", "ministerial_latest", "legis_init", "legis_init_latest", "ai", "tesseract", "decrees", "dates", "plenar_latest"]
#default = ["plenar", "runner", "vectordb", "austria", "eu", "ministerial", "ministerial_latest", "legis_init", "legis_init_latest", "tesseract", "decrees", "dates", "plenar_latest", "volksbg"]
# default = ["runner", "eu", "plenar", "legis_init", "legis_init_latest", "ai", "parties"]
#default = ["runner", "eu", "parties", "]
default = ["runner", "volksbg", "austria", "news", "vectordb"]
# default = ["runner", "ministerial", "ministerial_latest", "legis_init", "legis_init_latest", "decrees", "dates", "plenar_latest", "plenar"]
# default = ["runner", "legis_init_latest", "ministerial_latest", "ministerial", "ai"]

austria = []
eu = []

models = ["dotenvy", "chrono", "ocrs"] # remove ocrs again
runner = ["models", "chrono", "reqwest", "simple_logger", "tokio", "dotenvy"]
utoipa = ["dep:utoipa", "combx/utoipa"]
tesseract = ["dep:tesseract-rs", "combx/tesseract"]

ocrs = ["dep:ocrs", "combx/ocrs", "combx/rten", "combx/rten-imageproc", "combx/rten-tensor"]

news = ["qdrant-client", "uuid", "ai"]
vectordb = ["qdrant-client", "uuid", "ai"]
ai = []
legis_init_latest = []
legis_init = []
ministerial_latest = []
ministerial = []
proposals_latest = []
proposals = []
plenar = []
plenar_latest = []
parties = []
decrees = []
dates = []
parliamentary_qa = ["ai"]
volksbg = []

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
