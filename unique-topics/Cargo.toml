[package]
name = "unique-topics"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "unique-topics"
path = "src/main.rs"

[[bin]]
name = "topic-stats"
path = "src/topic_stats.rs"

[dependencies]
sqlx = { workspace = true }
combx = { path = "../combx" }
tokio = { workspace = true }
clap = { version = "4.5.53", features = ["derive"] }
fasttext = "0.8.0"
fastembed = "5.16.0"
eframe = "0.34.3"
egui_graphs = "0.30.0"
petgraph = "0.8.3"
serde = { workspace = true }
eurovoc = { path = "../../eurovoc", default-features = false, features = ["serde"] }
serde_json = "1.0.151"

