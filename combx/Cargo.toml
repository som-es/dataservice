[package]
name = "combx"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { workspace = true }
somes-scraper = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
dotenvy_macro = { workspace = true }
log = { workspace = true }
utoipa = { workspace = true, optional = true }
reqwest = { workspace = true }
somai-client = { path = "../somai-client" }
# somes-common-lib = { path = "../../somes/somes-common-lib" }
somes-common-lib = {workspace = true }
somes-meilisearch-filter = { path = "../../somes/somes-meilisearch-filter" }
# somes-meilisearch-filter = {branch="sveltev5", git = "ssh://git@github.com/som-es/somes" }
somes-macro = { path = "../../somes/somes-macro" }
#somes-macro = { branch="sveltev5", git = "ssh://git@github.com/som-es/somes"}
optional_struct = "0.5"
lopdf = "0.38.0"
image = "0.25.9"
poppler-rs = "0.25"
ocrs = { workspace = true, optional = true }
tesseract-rs = { workspace = true, optional = true }
rten = { version = "0.22.0", default-features = false, optional = true }
rten-imageproc = { version = "0.22.0", optional = true }
rten-tensor = { version = "0.22.0", optional = true }
schemars = { workspace = true }
tokio = { workspace = true }
chrono-tz = {workspace = true}

[dev-dependencies]
serde_qs = "0.15"
simple_logger = { version="5"}

[features]
default = ["utoipa", "ocrs", "ocr"]

ocrs = ["dep:ocrs", "rten", "rten-imageproc", "rten-tensor"]
utoipa = ["dep:utoipa"]
tesseract = ["dep:tesseract-rs", "ocr"]
ocr = []
