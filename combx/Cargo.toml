[package]
name = "combx"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { workspace = true }
somes-scraper = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
dotenvy_macro = { workspace = true }
log = { workspace = true }
utoipa = { version = "4.2.0", optional = true }
reqwest = { workspace = true }
somai-client = { path = "../somai-client" }
somes-common-lib = { path = "../../somes/somes-common-lib" }
somes-macro = { path = "../../somes/somes-macro" }
optional_struct = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["tokio-macros", "macros", "rt", "rt-multi-thread", "signal"] }

[features]
utoipa = ["dep:utoipa"]
